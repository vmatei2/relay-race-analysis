[project]
name = "relay-race-analysis"
version = "0.1.0"
description = "Reproducible lap-by-lap relay race analysis and a static interactive report."
readme = "README.md"
requires-python = ">=3.14.8"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "kaleido>=1.4.0",
    "plotly>=7.1.0",
]

[project.scripts]
relay-race-analysis = "relay_race_analysis.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
